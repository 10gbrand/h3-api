version: '3'

tasks:
  dev:
    desc: Starta API-server med auto-reload
    cmds:
      - uv run uvicorn h3_api.main:app --reload --host 0.0.0.0 --port 8000

  run:
    desc: Starta API-server (produktion)
    cmds:
      - uv run uvicorn h3_api.main:app --host 0.0.0.0 --port 8000

  health:
    desc: Testa health endpoint
    cmds:
      - curl -s http://localhost:8000/health | jq

  ready:
    desc: Testa ready endpoint (med databas-status)
    cmds:
      - curl -s http://localhost:8000/ready | jq

  docs:
    desc: Öppna API-dokumentation i webbläsare
    cmds:
      - open http://localhost:8000/docs

  docker-build:
    desc: Bygg Docker-image
    cmds:
      - docker build -t h3-api .

  docker-run:
    desc: Kör Docker-container
    cmds:
      - docker run --rm -p 8000:8000 -v ../g-etl/data:/data:ro -e H3_API_DATABASE_PATH=/data/warehouse.duckdb h3-api

  viewer:
    desc: Öppna kartvisare (deck.gl)
    cmds:
      - open http://localhost:8000/viewer/

  layers:
    desc: Lista tillgängliga lager
    cmds:
      - curl -s http://localhost:8000/hexbin/layers | jq

  fast:
    desc: Hämta snabb H3-data för ett lager (default naturreservat)
    vars:
      LAYER: '{{.LAYER | default "naturreservat"}}'
    cmds:
      - 'curl -s "http://localhost:8000/hexbin/fast/{{.LAYER}}" | jq "{layer: .layer, resolution: .resolution, count: .count}"'
